included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - private_outlet
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_comma

identifier_name:
  excluded:
    - i
    - a
    - b
    - c
    - id
    - llama33_70b
    - llama31_8b
    - llama32_1b
    - llama32_3b
    - llama32_11b_vision
    - llama32_90b_vision
    - gemma2_9b
    - deepseekR1_70b

type_body_length:
  warning: 500
  error: 600

file_length:
  warning: 1200
  error: 1500

line_length:
  warning: 150
  error: 200
  ignores_urls: true

function_body_length:
  warning: 60
  error: 80
